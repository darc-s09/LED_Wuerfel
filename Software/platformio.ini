; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Zwei Umgebungen, Auswahl in VS Code unten in der Statusleiste
; (oder: platformio run -e atmega168p_baremetal -t upload):
;   atmega328p_baremetal  neue Platinen mit ATmega328P (Standard)
;   atmega168p_baremetal  erste Platine mit ATmega168P
;
; Neue Controller einmalig mit "Set Fuses" (platformio run -t fuses)
; auf den 12-MHz-Quarz umstellen, sonst laufen sie mit 1 MHz.
; "Set Fuses" loescht dabei den Chip: also zuerst Fuses, danach Upload.

[platformio]
; Die Quellen liegen direkt in diesem Ordner (nicht in src/)
src_dir = .
include_dir = .
default_envs = atmega328p_baremetal

; gemeinsame Einstellungen fuer alle Umgebungen
[env]
platform = atmelavr
framework =   ; kein Framework
board_build.f_cpu = 12000000UL   ; Quarz 12 MHz (Board-Vorgabe waere 16 MHz)

build_src_filter = +<*.c> -<.pio/>
build_flags =
    -DUART_DEBUG=0     ; 1 = Debug-Befehle ueber RS485
    -funsigned-char
    -mrelax

; DIAMEX ISP USB-Prog NG: STK500v2 ueber virtuellen COM-Port
; Vor dem Programmieren die Jumper am ISP-Stecker abziehen!
upload_protocol = stk500v2
upload_port = COM3        ; laut Geraete-Manager anpassen
upload_speed = 115200
; PlatformIO uebergibt immer -D (nicht loeschen, fuer Bootloader gedacht).
; Ueber ISP muss der Flash vorher geloescht werden, sonst Verify-Fehler.
; Achtung: Chip-Erase loescht auch das EEPROM (Kalibrierwert), da EESAVE nicht gesetzt ist.
; Port und Geschwindigkeit stehen zusaetzlich hier, weil "Set Fuses"
; sie sonst nicht an avrdude uebergibt.
upload_flags =
    -e
    -P$UPLOAD_PORT
    -b$UPLOAD_SPEED

[env:atmega328p_baremetal]
board = ATmega328P
board_build.mcu = atmega328p     ; ATmega328P/PA (Signatur 1E 95 0F)
; Fuses: externer Quarz 8-16 MHz, kein Teiler /8, ISP an, kein Bootloader,
; Brown-out bei 2,7 V (schuetzt das EEPROM beim Aus- und Einschalten)
board_fuses.lfuse = 0xFF
board_fuses.hfuse = 0xD9
board_fuses.efuse = 0xFD
board_fuses.lock_bits = 0xFF     ; keine Sperren (kein Bootloader)

[env:atmega168p_baremetal]
board = atmega168
board_build.mcu = atmega168p     ; ATmega168P/PA (Signatur 1E 94 0B)
; Fuses der ersten Platine (ausgelesen): Low 0xFD stellt den Oszillator auf
; 3-8 MHz; fuer den 12-MHz-Quarz waere 0xFF (8-16 MHz) vorgesehen.
board_fuses.lfuse = 0xFD
board_fuses.hfuse = 0xDF
board_fuses.efuse = 0xF9
board_fuses.lock_bits = 0xFF     ; keine Sperren (kein Bootloader)

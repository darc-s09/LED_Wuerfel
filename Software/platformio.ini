; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Die Quellen liegen direkt in diesem Ordner (nicht in src/)
src_dir = .
include_dir = .

[env:atmega168p_baremetal]
platform = atmelavr
board = atmega168
board_build.mcu = atmega168p     ; verbaut ist ein ATmega168P/PA (Signatur 1E 94 0B)
board_build.f_cpu = 12000000UL   ; Keramikresonator 12 MHz (Board-Vorgabe waere 16 MHz)
framework =   ; kein Framework

build_src_filter = +<*.c> -<.pio/>
build_flags =
    -DUART_DEBUG=0     ; 1 = Debug-Befehle ueber RS485
    -funsigned-char
    -mrelax

; DIAMEX ISP USB-Prog NG: STK500v2 ueber virtuellen COM-Port
; Vor dem Programmieren die Jumper am ISP-Stecker abziehen!
upload_protocol = stk500v2
upload_port = COM3        ; laut Geraete-Manager anpassen
upload_speed = 115200
; PlatformIO uebergibt immer -D (nicht loeschen, fuer Bootloader gedacht).
; Ueber ISP muss der Flash vorher geloescht werden, sonst Verify-Fehler.
; Achtung: Chip-Erase loescht auch das EEPROM (Kalibrierwert), da EESAVE nicht gesetzt ist.
upload_flags = -e
